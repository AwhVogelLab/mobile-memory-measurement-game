<!DOCTYPE html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/reset_and_verification.css">
</head>
<body>
    <div id="header"></div>

    <script>
        fetch("/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
    </script>

    <!-- [Start] All new Code -->
    <div id="input_new_password" class="whole_page">
        <img src="/Assets/Account/New_Password/New Password Background and Logo.png" class="background_and_logo">

        <div id="input_containers_signup" class="input_containers_new_pswd">
            <div id="pswd_input" class="password_input">
                <img src="/Assets/Account/New_Password/New Password Txt.png" class="txt_h1">
                <img src="/Assets/Account/Password Input Box.png" class="input_box">
            </div>

            <div id="retype_pswd_input" class="password_input">
                <img src="/Assets/Account/New_Password/Retype New Password Text.png" class="txt_h1">
                <img src="/Assets/Account/Password Input Box.png" class="input_box">
            </div>

            <img src="/Assets/Account/New_Password/Change Password Button.png" class="button">
        </div>
    </div>
    <!-- [End] All new Code -->
    

    <h1>Reset Password</h1>

    <form id="resetForm">
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password">

        <button type="submit">Update Password</button>
    </form>

    <p id="status"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="/js/SupabaseClient.js"></script>
    <script type="module" src="/js/reset_password.js"></script>
</body>
