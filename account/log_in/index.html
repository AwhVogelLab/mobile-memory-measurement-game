<!DOCTYPE html>
<head>
    <title>Log In</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="header"></div>

    <script>
        fetch("/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
    </script>

    <!-- [Start] All new Code -->
    <div id="all_login_page" class="whole_page">
        <img src="/Assets/Account/Login_Page/Login Background.png" class="background_and_logo">

        <form id="loginForm" class="input_containers">

            <div id="email_input" class="email_input">
                <img src="/Assets/Account/email.png" class="txt_h1">

                <input type="text" id="email" name="email" placeholder="Enter your email" class="email_input_box" >
            </div>

            <div id="password_input" class="password_input">
                <img src="/Assets/Account/password.png" class="txt_h1">

                <input type="password" id="password" name="password" placeholder="Enter your password" class="password_input_box">
                <p id="loginError" style="display: none; color: red;">
                    Invalid email or password.
                </p>
            </div>

            <a href="/account/forgot_password/">
                <img src="/Assets/Account/Forgot password.png" class="forgot_password">
            </a>

            <button type="submit" class="button">
                <img src="/Assets/Account/Login_Page/Sign In Button.png">
            </button>

            <img src="/Assets/Account/Login_Page/Line 17.png" class="line">

            <a href="/account/sign_up/">
                <img src="/Assets/Account/Login_Page/dont have an account_ sign up.png" class="txt_h2">
            </a>

        </form>
    </div>

    <!-- [End] All new Code -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="/js/SupabaseClient.js"></script>
    <script type="module" src="/js/login.js"></script>
</body>
