<!DOCTYPE html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div id="header"></div>

    <script>
        fetch("/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
    </script>
    
    <!-- [Start] All new Code -->
    <a href="/account/log_in/" class="button">
        <img src="/Assets/Account/Sign_Up_Page/Back to Log in.png">
    </a>

    <div id="reset_password_page" class="whole_page">

        <img src="/Assets/Account/Reset_Password/Reset Password Background + Logo.png" class="background_and_logo">

        <form id="forgotForm" class="input_containers_reset_pswd">

            <div id="email_input" class="email_input">
                <img src="/Assets/Account/email.png" class="txt_h1">
                <input type="email" id="email" name="email" placeholder="Enter your email" class="email_input_box" required>
            </div>

            <button type="submit" class="button">
                <img src="/Assets/Account/Reset_Password/Send Email Button.png" alt="Send Email">
            </button>

            <p id="status"></p>

        </form>

    </div>
    <!-- [End] All new Code -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="/js/SupabaseClient.js"></script>
    <script type="module" src="/js/forgot_password.js"></script>
</body>
