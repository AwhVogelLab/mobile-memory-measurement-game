<!DOCTYPE html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div id="header"></div>

    <!-- [Start] All new Code -->
    <a href="/account/log_in/" class="button">
        <img src="/Assets/Account/Sign_Up_Page/Back to Log in.png">
    </a>

    <div id="sign_up_page" class="whole_page">
        <img src="/Assets/Account/Sign_Up_Page/Sign Up Background.png" class="background_and_logo">

        <form id="signupForm" class="input_containers_signup">

            <div id="email_input" class="email_input">
                <img src="/Assets/Account/email.png" class="txt_h1">

                <input type="email" id="email" name="email" placeholder="Enter your email" class="email_input_box" required>
            </div>

            <div id="password_input" class="password_input">
                <img src="/Assets/Account/password.png" class="txt_h1">

                <input type="password" id="password" name="password" placeholder="Enter your password" class="password_input_box" required>
            </div>

            <button type="submit" class="button">
                <img src="/Assets/Account/Sign_Up_Page/Sign Up Button.png" alt="Sign Up">
            </button>

            <p id="signupError" style="display: none; color: red;"> Unable to validate email address. </p>
            <p id="signupSuccess" style="display: none;"></p>

        </form>
    </div>
    <!-- [End] All new Code -->
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="/js/SupabaseClient.js"></script>
    <script type="module" src="/js/signup.js"></script>

</body>
