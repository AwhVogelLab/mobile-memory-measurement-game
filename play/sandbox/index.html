<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sandbox Mode</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/game.css">
    <style>
        #canvasContainer {
            position: relative;
        }

        #myCanvas {
            display: block;
        }

        #accuracyDisplay {
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>

<div id="header"></div>

<script>
    fetch("/header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
        });
</script>

<div id="gameLayout" class="gameLayout">


    <div id="canvasContainer">
        <canvas id="myCanvas"
            style="border:5px solid #b8c1ec; background-color: #969696;">
        </canvas>
    </div>

    <div class="infoPanel" id="infoPanel">
        <h2 class="instructions">Sandbox</h2>
        <p class="instructions">Click the shape that changed.</p>
        <p id="roundDisplay">Round: 1</p>
        <p id="pointDisplay">Points: 0</p>
        <p id="maxStreakDisplay">Best streak: 0</p>
    </div>

</div>

<div id="gameBackground" class="gameBackground">
    <div class="sand"></div>
    <div class="header_L"></div>
    <div class="header_M"></div>
    <div class="header_R"></div>

    <img src="/Assets/Game_Page/Game/Goldfish.png" class="goldfish_L">
    <img src="/Assets/Game_Page/Game/Goldfish.png" class="goldfish_R">
</div>

<div id="resultsScreen" class="resultsScreen" hidden>
    <div class="background_tint"></div>
    <div class="round_complete">
        <img src="/Assets/Game_Page/Round_Complete/Round Complete UI.png">
        <div id="result_correct" class="result_correct"></div>
        <div id="result_streak" class="result_streak"></div>
        <div id="result_score" class="result_score"></div>
        <button id="play_again" class="result_button">
            <img src="/Assets/Game_Page/Round_Complete/Play Button.png" alt="Play Again">
        </button>
    </div>

</div>

<div id="gameSettings" class="gameSettings" hidden>
    <div class="background_tint"></div>
    <div class="new_game">
        <img src="/Assets/Game Settings/Blank Settings UI.png">

        <button id="four_button" class="four_button">
            <img src="/Assets/Game Settings/4 Shapes Button.png">
        </button>
        <button id="five_button" class="five_button">
            <img src="/Assets/Game Settings/5 Shapes Button (Green).png">
        </button>
        <button id="six_button" class="six_button">
            <img src="/Assets/Game Settings/6 Shapes Button.png">
        </button>

        <button id="add_button" class="add_button">
            <img src="/Assets/Game Settings/Add Icon.png">
        </button>
        <button id="subtract_button" class="subtract_button">
            <img src="/Assets/Game Settings/Subtract Icon.png">
        </button>
        <button id="play_button" class="play_button">
            <img src="/Assets/Game Settings/Play Button.png">
        </button>
        <div id="numRounds" class="numRounds"></div>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="/js/SupabaseClient.js"></script>
<script type="module" src="/js/sandbox.js"></script>

</html>
