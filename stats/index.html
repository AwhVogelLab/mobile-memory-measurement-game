<!DOCTYPE html>
<head>
    <title>Stats</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="/css/stats.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="header"></div>

    <script>
        fetch("../header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
    </script>


    <img src="/Assets/Stats_Page/player stats text.png" class="stats_title">

    <!-- comment this container out to remove the dailies atop -->
    <div id="weekly_login_streak" class="weekly_login_streaks">
        <img src="/Assets/Stats_Page/Login Streak Tracker Background Better.png" class="weekly_login_streak_background">

        <div id="all_daily_logins" class="all_daily_logins">
            <div id="daily_login_box_1" class="daily_login_box_1">
                <img src="/Assets/Stats_Page/Goldfish Daily Login.png" class="daily_goldfish">
                <img src="/Assets/Stats_Page/Daily Login Background Empty.png" class="daily_login_background">
                <!-- <h2>1</h2> -->
            </div>
            <div id="daily_login_box_2" class="daily_login_box_2">
                <img src="/Assets/Stats_Page/Goldfish Daily Login.png" class="daily_goldfish">
                <img src="/Assets/Stats_Page/Daily Login Background Empty.png" class="daily_login_background">
                <!-- <h2>2</h2> -->
            </div>
            <div id="daily_login_box_3" class="daily_login_box_3">
                <img src="/Assets/Stats_Page/Goldfish Daily Login.png" class="daily_goldfish">
                <img src="/Assets/Stats_Page/Daily Login Background Empty.png" class="daily_login_background">
                <!-- <h2>3</h2> -->
            </div>
            <div id="daily_login_box_4" class="daily_login_box_4">
                <img src="/Assets/Stats_Page/Goldfish Daily Login.png" class="daily_goldfish">
                <img src="/Assets/Stats_Page/Daily Login Background Empty.png" class="daily_login_background">
                <!-- <h2>4</h2> -->
            </div>
            <div id="daily_login_box_5" class="daily_login_box_5">
                <img src="/Assets/Stats_Page/Goldfish Daily Login.png" class="daily_goldfish">
                <img src="/Assets/Stats_Page/Daily Login Background Empty.png" class="daily_login_background">
                <!-- <h2>5</h2> -->
            </div>
            <div id="daily_login_box_6" class="daily_login_box_6">
                <img src="/Assets/Stats_Page/Goldfish Daily Login.png" class="daily_goldfish">
                <img src="/Assets/Stats_Page/Daily Login Background Empty.png" class="daily_login_background">
                <!-- <h2>6</h2> -->
            </div>
            <div id="daily_login_box_7" class="daily_login_box_7">
                <img src="/Assets/Stats_Page/Goldfish Daily Login.png" class="daily_goldfish">
                <img src="/Assets/Stats_Page/Daily Login Background Empty.png" class="daily_login_background">
                <!-- <h2>7</h2> -->
            </div>
        </div>
    </div> 

    <img src="/Assets/Stats_Page/Goldfish + Text.png" class="mascot">




    <div id="stat_displays" class="stat_displays">
        <img src="/Assets/Stats_Page/Stats Page Sandy Background.png" class="sandy_background">

        <div id="stat_columns" class="stat_columns">

            <div id="stat_row_1" class="stat_row_1">
                <div id="login_streak" class="small_stats_box">
                    <img src="/Assets/Stats_Page/(No days) Login Streak Bubble Icon.png" class="small_bubble_background">

                    <div id="login_streak_elements" class="bubble_elements">
                        <div id="streak_start_date" class ="streak_start_date">
                            <p style="font-size: 16px;">Since </p>
                            <p style="font-size: 16px;">xx/xx/xxxx</p>
                        </div>

                        <div id="number_days" class="stat_text">
                            <h2 style="font-size: 48px";>100</h2>
                            <p style="font-size: 24px">days</p>
                        </div>
                    </div>
                </div>

                <div id="shapes_correct" class="small_stats_box">
                    <img src="/Assets/Stats_Page/(No shapes) Most Shapes Correct Icon.png" class="small_bubble_background">

                    <div id="login_streak_elements" class="bubble_elements">
                        <div id="number_shapes" class="stat_text">
                            <h2 style="font-size: 48px";>7</h2>
                            <p style="font-size: 24px">shapes</p>
                        </div>
                    </div>

                </div>
            </div>


            <div id="stat_row_2" class="stat_row_2">
                <div id="best_shape" class="small_stats_box">
                   <img src="/Assets/Stats_Page/Best Shape Icon.png" class="small_bubble_background">

                    <div id="shape_stats" class="bubble_elements">
                        <div id="shape_and_name" class="stat_text">
                            <img src="/Assets/Stats_Page/Circle.png" class="best_shape">
                            <p style="font-size: 24px">Circle</p>
                        </div>
                    </div>

                </div>

                <div id="best_color" class="small_stats_box">
                    <img src="/Assets/Stats_Page/Best Color Icon.png" class="small_bubble_background">

                    <div id="color_stats" class="bubble_elements">
                        <div id="color_and_name" class="stat_text">
                            <img src="/Assets/Stats_Page/Circle.png" class="best_shape" id="best_shape">
                            <p style="font-size: 24px">White</p>
                        </div>
                    </div>
                </div>
            </div>


            <!-- <div id="login_streak_data" class="login_streak_data">

            </div> -->


            <div id="stat_row_4" class="stat_row_4">

                <div id="avg_pts" class="small_stats_box">
                    <img src="/Assets/Stats_Page/Avg Points Icon No PTS.png" class="small_bubble_background">

                    <div id="avg_pts_stats" class="bubble_elements">

                        <div id="pts_and_text" class="stat_text">
                            <h2 style="font-size: 48px";>1782</h2>
                        </div>
                    </div>
                </div>

                <div id="highest_score" class="small_stats_box">
                    <img src="/Assets/Stats_Page/Highest Score Icon No PTS.png" class="small_bubble_background">

                    <div id="high_score_stats" class="bubble_elements">

                        <div id="score_and_text" class="stat_text">
                            <h2 style="font-size: 48px";>2084</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="/js/SupabaseClient.js"></script>
<script type="module" src="/js/stats.js"></script>

</body>
